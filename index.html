/* ============================================================
   styles.css — Futbol Analytics
   ============================================================ */

:root {
  --green-900: #0b3d24;
  --green-700: #15803d;
  --green-600: #16a34a;
  --green-500: #22c55e;
  --green-100: #dcfce7;
  --ink-900: #0f172a;
  --ink-800: #1e293b;
  --ink-700: #334155;
  --ink-500: #64748b;
  --ink-300: #cbd5e1;
  --ink-200: #e2e8f0;
  --ink-100: #f1f5f9;
  --bg: #f6f8f7;
  --card-bg: #ffffff;
  --red: #dc2626;
  --amber: #d97706;
  --blue: #2563eb;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 4px 16px rgba(15, 23, 42, 0.05);
  font-size: 15px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--ink-800);
}

a { color: var(--green-700); text-decoration: none; }
.btn-link { color: var(--green-700); font-weight: 600; cursor: pointer; }
h1, h2, h3, h4 { margin: 0 0 8px; color: var(--ink-900); }
p { margin: 0 0 8px; line-height: 1.5; }
.muted { color: var(--ink-500); }

/* ---------- Layout ---------- */
.app-shell { display: flex; min-height: 100vh; }

.sidebar {
  width: 250px;
  background: linear-gradient(180deg, var(--ink-900), #0a1f14 140%);
  color: #fff;
  display: flex;
  flex-direction: column;
  padding: 20px 14px;
  position: sticky;
  top: 0;
  height: 100vh;
  flex-shrink: 0;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 20px; }
.brand-icon { font-size: 28px; }
.brand-title { font-weight: 700; font-size: 16px; color: #fff; }
.brand-sub { font-size: 12px; color: #9fd8b3; }

.nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.nav a {
  color: #cfe9d8;
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
}
.nav a:hover { background: rgba(255,255,255,0.08); color: #fff; }
.nav a.active { background: var(--green-600); color: #fff; }

.sidebar-footer { font-size: 12px; color: #9fb8a8; padding: 10px 8px 0; border-top: 1px solid rgba(255,255,255,0.1); margin-top: 10px; }
.sidebar-footer .btn-link { color: var(--green-500); font-weight: 600; }

.main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 24px;
  background: var(--card-bg);
  border-bottom: 1px solid var(--ink-200);
  position: sticky; top: 0; z-index: 5;
}
.topbar-title { font-weight: 700; font-size: 18px; flex: 1; }
.icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; display: none; }

.app-content { padding: 24px; max-width: 1280px; width: 100%; margin: 0 auto; }

/* ---------- Cards / Grid ---------- */
.card {
  background: var(--card-bg);
  border: 1px solid var(--ink-200);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
}
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 900px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 600px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } }

.stat-card { display: flex; flex-direction: column; gap: 4px; }
.stat-value { font-size: 30px; font-weight: 800; color: var(--green-700); }
.stat-label { color: var(--ink-500); font-size: 13px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 16px; border-radius: 9px; border: 1px solid transparent;
  font-size: 14px; font-weight: 600; cursor: pointer; background: var(--ink-100); color: var(--ink-800);
}
.btn:hover { filter: brightness(0.97); }
.btn-primary { background: var(--green-600); color: #fff; }
.btn-primary:hover { background: var(--green-700); }
.btn-outline { background: transparent; border-color: var(--ink-300); }
.btn-danger { background: #fee2e2; color: var(--red); }
.btn-sm { padding: 6px 12px; font-size: 13px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }

/* ---------- Forms ---------- */
label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-700); margin-bottom: 5px; }
input, select, textarea {
  width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--ink-300);
  font-size: 14px; font-family: inherit; background: #fff; color: var(--ink-900);
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--green-500); outline-offset: 1px; border-color: var(--green-500); }
.field { margin-bottom: 14px; }
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
fieldset { border: 1px solid var(--ink-200); border-radius: var(--radius); padding: 16px; margin: 0 0 18px; }
legend { font-weight: 700; padding: 0 8px; color: var(--green-700); }
.help-text { font-size: 12px; color: var(--ink-500); margin-top: 4px; }

/* ---------- Tables ---------- */
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--ink-200); }
th { color: var(--ink-500); font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
tr:hover td { background: var(--ink-100); }
.table-wrap { overflow-x: auto; }

/* ---------- Badges ---------- */
.badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.badge-green { background: var(--green-100); color: var(--green-700); }
.badge-blue { background: #dbeafe; color: var(--blue); }
.badge-amber { background: #fef3c7; color: var(--amber); }
.badge-red { background: #fee2e2; color: var(--red); }
.badge-gray { background: var(--ink-100); color: var(--ink-500); }

/* ---------- Player cards ---------- */
.player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.player-card {
  background: var(--card-bg); border: 1px solid var(--ink-200); border-radius: var(--radius);
  padding: 16px; text-align: center; box-shadow: var(--shadow); cursor: pointer; transition: transform .1s;
}
.player-card:hover { transform: translateY(-2px); border-color: var(--green-500); }
.avatar {

}
.avatar-sm { width: 40px; height: 40px; font-size: 14px; }
.avatar-lg { width: 130px; height: 130px; font-size: 40px; }

.player-name { font-weight: 700; margin-top: 6px; }
.player-meta { font-size: 12px; color: var(--ink-500); }

/* ---------- Profile header ---------- */

.profile-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

.tab-btn { padding: 10px 16px; border: none; background: none; font-weight: 600; color: var(--ink-500); cursor: pointer; border-bottom: 2px solid transparent; }
.tab-btn.active { color: var(--green-700); border-color: var(--green-600); }

/* ---------- Score bar ---------- */

/* ---------- Modal ---------- */
.modal-backdrop {

/* ---------- Toasts ---------- */
#toast-host { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 100; }
.toast {

.toast-error { background: var(--red); }

/* ---------- Empty state ---------- */

/* ---------- Misc ---------- */

.gap-12 { gap: 12px; }

.divider { height: 1px; background: var(--ink-200); margin: 18px 0; border: none; }

  <script>

/* ===== modulo: js/utils.js ===== */
const Utils = (function () {

/* ============================================================
   utils.js — funciones auxiliares reutilizables
   ============================================================ */

function calcAge(fechaNacimientoISO, atDateISO = null) {
  if (!fechaNacimientoISO) return null;
  const born = new Date(fechaNacimientoISO);
  const at = atDateISO ? new Date(atDateISO) : new Date();
  let age = at.getFullYear() - born.getFullYear();
  const m = at.getMonth() - born.getMonth();
  if (m < 0 || (m === 0 && at.getDate() < born.getDate())) age--;
  return age;
}

function calcIMC(pesoKg, tallaCm) {
  if (!pesoKg || !tallaCm) return null;
  const tallaM = tallaCm / 100;
  const imc = pesoKg / (tallaM * tallaM);
  return Math.round(imc * 10) / 10;
}

// Clasificación aproximada de IMC infantil/juvenil (referencia orientativa,
// no diagnóstica). Ajustable desde Configuración.
function clasificarIMC(imc) {
  if (imc == null) return '—';
  if (imc < 18.5) return 'Delgadez';
  if (imc < 25) return 'Peso normal';
  if (imc < 30) return 'Sobrepeso';
  return 'Obesidad';
}

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('es-CO', { year: 'numeric', month: '2-digit', day: '2-digit' });
}

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

const BOOLEAN_ATTRS = new Set(['selected', 'required', 'checked', 'disabled', 'readonly', 'multiple']);

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') {
      node.addEventListener(k.slice(2).toLowerCase(), v);
    } else if (BOOLEAN_ATTRS.has(k)) {
      if (v) node.setAttribute(k, '');
    } else if (v !== undefined && v !== null) {
      node.setAttribute(k, v);
    }
  }
  (Array.isArray(children) ? children : [children]).forEach((c) => {
    if (c === null || c === undefined || c === '') return;
    const isNode = typeof c === 'object' && typeof c.nodeType === 'number';
    node.appendChild(isNode ? c : document.createTextNode(String(c)));
  });
  return node;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function downloadJSON(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function initials(nombres = '', apellidos = '') {
  const a = (nombres || '').trim().charAt(0);
  const b = (apellidos || '').trim().charAt(0);
  return (a + b).toUpperCase() || '?';
}

function toast(msg, type = 'info') {
  let host = document.getElementById('toast-host');
  if (!host) {
    host = document.createElement('div');
    host.id = 'toast-host';
    document.body.appendChild(host);
  }
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  host.appendChild(t);
  (typeof requestAnimationFrame === 'function' ? requestAnimationFrame : setTimeout)(() => t.classList.add('show'));
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 300);
  }, 3200);
}

function confirmDialog(msg) {
  return window.confirm(msg);
}

function debounce(fn, wait = 250) {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), wait);
  };
}

function navigate(path) {
  window.location.hash = path;
}

function scoreColor(score) {
  if (score === null || score === undefined) return '#94a3b8';
  if (score >= 8) return '#16a34a';
  if (score >= 6.5) return '#22c55e';
  if (score >= 5) return '#d97706';
  return '#dc2626';
}

function scoreBarRow(label, value) {
  const pct = value === null || value === undefined ? 0 : Math.max(0, Math.min(100, value * 10));
  const color = scoreColor(value);
  const row = el('div', { class: 'score-row' }, [
    el('div', { class: 'score-label' }, label),
    el('div', { class: 'score-track' }, [
      el('div', { class: 'score-fill', style: `width:${pct}%; background:${color};` }),
    ]),
    el('div', { class: 'score-value' }, value === null || value === undefined ? '—' : String(value)),
  ]);
  return row;
}

  return { calcAge, calcIMC, clasificarIMC, formatDate, todayISO, el, fileToBase64, downloadJSON, initials, toast, confirmDialog, debounce, navigate, scoreColor, scoreBarRow };
})();

const Seed = (function () {

/* ============================================================
   seed.js — Configuración por defecto de la aplicación
   ------------------------------------------------------------
   Los baremos numéricos (fuerza abdominal, salto vertical,
   salto horizontal y test de Cooper) fueron transcritos de:
     "PROTOCOLOS DE LAS PRUEBAS DE VALORACION.docx"
   (tablas de resultados por edad, 12 a 18 años, escala de
   puntos 0 a 10 en pasos de 0.5).

   Algunas celdas del documento original tenían inconsistencias
   de formato (comas en vez de puntos, valores sin separador de
   miles). Se normalizaron a la unidad indicada en cada prueba.
   La columna de 18 años en salto horizontal y Cooper venía
   vacía en el documento original: se estimó igual al valor de
   17 años (marcado como "estimado").

   La prueba de Flexo-extensión de codo también traía su tabla
   vacía en el documento original: se generó una escala estimada
   a partir de la de fuerza abdominal. TODOS estos valores son
   editables desde Configuración > Baremos dentro de la app.

   Las pruebas técnico-futbolísticas de la matriz del club
   (coordinación, conducción, potencia de golpeo, carrera con
   pase, precisión, control de balón) y la prueba de agilidad y
   los 30 metros no traían tabla de baremos en el documento, así
   que se evalúan con calificación cualitativa 0-10 asignada por
   el entrenador/preparador físico, guardando también el valor
   crudo para seguimiento histórico.
   ============================================================ */

const POINTS = [10, 9.5, 9, 8.5, 8, 7.5, 7, 6.5, 6, 5.5, 5, 4.5, 4, 3.5, 3, 2.5, 2, 1.5, 1, 0.5, 0];

    table: buildTable({
      12: [34, 33, 32, 32, 31, 30, 29, 28, 27, 25, 24, 22, 21, 20, 18, 17, 15, 14, 13, 11, 10],
      13: [36, 35, 34, 34, 33, 32, 32, 30, 29, 27, 26, 25, 23, 22, 20, 19, 18, 16, 15, 13, 12],
      14: [38, 37, 36, 36, 35, 34, 34, 32, 31, 29, 28, 27, 25, 25, 24, 22, 21, 20, 18, 17, 15],
      15: [39, 39, 38, 37, 36, 36, 35, 34, 32, 31, 29, 28, 27, 26, 25, 24, 22, 21, 20, 18, 17],
      16: [41, 41, 40, 39, 39, 38, 37, 36, 34, 33, 32, 30, 29, 27, 26, 25, 23, 22, 20, 19, 18],
      17: [43, 43, 42, 41, 41, 40, 39, 38, 36, 35, 34, 32, 31, 29, 28, 27, 25, 24, 22, 21, 20],
      18: [43, 43, 42, 41, 41, 40, 39, 38, 36, 35, 34, 32, 31, 29, 28, 27, 25, 24, 22, 21, 20],

  saltoVertical: {
    label: 'Salto vertical (cm)',
    unit: 'cm',
    estimated: false,

async function seedIfEmpty(DB) {
  const baremos = await DB.getConfig('baremos');
  if (!baremos) await DB.setConfig('baremos', BAREMOS_SEED);

  const tests = await DB.getConfig('testDefinitions');
  if (!tests) await DB.setConfig('testDefinitions', TEST_DEFINITIONS);

  const posiciones = await DB.getConfig('posiciones');
  if (!posiciones) await DB.setConfig('posiciones', POSICIONES_SEED);

  const edades = await DB.getConfig('categoriasEdad');
  if (!edades) await DB.setConfig('categoriasEdad', CATEGORIAS_EDAD_SEED);

  const club = await DB.getConfig('clubInfo');
  if (!club) await DB.setConfig('clubInfo', CLUB_INFO_SEED);

  // Precarga de jugadores: solo se ejecuta una vez, si todavía no hay
  // ningún jugador registrado en este navegador.
  const existingPlayers = await DB.getAllPlayers();
  if (!existingPlayers || existingPlayers.length === 0) {
    for (const p of PLAYERS_SEED) {
      await DB.addPlayer({ ...p });
    }
  }
}

  return { BAREMOS_SEED, TEST_DEFINITIONS, CATEGORIAS, POSICIONES_SEED, CATEGORIAS_EDAD_SEED, CLUB_INFO_SEED, seedIfEmpty };
})();


/* ===== modulo: js/db.js ===== */
const DBMod = (function () {
/* ============================================================
   db.js — Capa de acceso a datos (IndexedDB)
   Toda la información de la app (jugadores, evaluaciones,
   fichas médicas, nutricionales y configuración) vive en el
   navegador del usuario mediante IndexedDB. No hay backend.
   ============================================================ */

const DB_NAME = 'futbolAnalyticsDB';
const DB_VERSION = 1;

const STORES = {
  players: 'id',
  evaluations: 'id',
  medical: 'id',
  nutrition: 'id',
  config: 'key',
};

let dbPromise = null;

function uid() {
  return (
    Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10)
  );
}

function openDatabase() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);

    req.onupgradeneeded = (evt) => {
      const db = evt.target.result;

      if (!db.objectStoreNames.contains('players')) {
        db.createObjectStore('players', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('evaluations')) {
        const s = db.createObjectStore('evaluations', { keyPath: 'id' });
        s.createIndex('playerId', 'playerId', { unique: false });
      }
      if (!db.objectStoreNames.contains('medical')) {
        const s = db.createObjectStore('medical', { keyPath: 'id' });
        s.createIndex('playerId', 'playerId', { unique: false });
      }
      if (!db.objectStoreNames.contains('nutrition')) {
        const s = db.createObjectStore('nutrition', { keyPath: 'id' });
        s.createIndex('playerId', 'playerId', { unique: false });
      }
      if (!db.objectStoreNames.contains('config')) {
        db.createObjectStore('config', { keyPath: 'key' });
      }
    };

    req.onsuccess = (evt) => resolve(evt.target.result);
    req.onerror = (evt) => reject(evt.target.error);
  });
  return dbPromise;
}

function tx(storeName, mode = 'readonly') {
  return openDatabase().then(
    (db) => db.transaction(storeName, mode).objectStore(storeName)
  );
}

function reqToPromise(req) {
  return new Promise((resolve, reject) => {
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

/* ---------- CRUD genérico ---------- */

async function addRecord(storeName, record) {
  const store = await tx(storeName, 'readwrite');
  if (!record.id && STORES[storeName] === 'id') record.id = uid();
  record.createdAt = record.createdAt || new Date().toISOString();
  record.updatedAt = new Date().toISOString();
  await reqToPromise(store.put(record));
  return record;
}

async function putRecord(storeName, record) {
  const store = await tx(storeName, 'readwrite');
  record.updatedAt = new Date().toISOString();
  await reqToPromise(store.put(record));
  return record;
}

async function getRecord(storeName, key) {
  const store = await tx(storeName);
  return reqToPromise(store.get(key));
}

async function getAllRecords(storeName) {
  const store = await tx(storeName);
  return reqToPromise(store.getAll());
}

async function getByIndex(storeName, indexName, value) {
  const store = await tx(storeName);
  const idx = store.index(indexName);
  return reqToPromise(idx.getAll(value));
}

async function deleteRecord(storeName, key) {
  const store = await tx(storeName, 'readwrite');
  await reqToPromise(store.delete(key));
}

async function clearStore(storeName) {
  const store = await tx(storeName, 'readwrite');
  await reqToPromise(store.clear());
}

/* ---------- API específica ---------- */

const DB = {
  uid,

  // Jugadores
  addPlayer: (p) => addRecord('players', p),
  updatePlayer: (p) => putRecord('players', p),
  getPlayer: (id) => getRecord('players', id),
  getAllPlayers: () => getAllRecords('players'),
  deletePlayer: async (id) => {
    await deleteRecord('players', id);
    const evals = await getByIndex('evaluations', 'playerId', id);
    for (const e of evals) await deleteRecord('evaluations', e.id);
    const meds = await getByIndex('medical', 'playerId', id);
    for (const m of meds) await deleteRecord('medical', m.id);
    const nuts = await getByIndex('nutrition', 'playerId', id);
    for (const n of nuts) await deleteRecord('nutrition', n.id);
  },

  // Evaluaciones físicas/técnicas
  addEvaluation: (e) => addRecord('evaluations', e),
  updateEvaluation: (e) => putRecord('evaluations', e),
  getEvaluation: (id) => getRecord('evaluations', id),
  getEvaluationsByPlayer: (playerId) => getByIndex('evaluations', 'playerId', playerId),
  getAllEvaluations: () => getAllRecords('evaluations'),
  deleteEvaluation: (id) => deleteRecord('evaluations', id),

  // Ficha médica
  addMedical: (m) => addRecord('medical', m),
  updateMedical: (m) => putRecord('medical', m),
  getMedicalByPlayer: (playerId) => getByIndex('medical', 'playerId', playerId),
  getAllMedical: () => getAllRecords('medical'),
  deleteMedical: (id) => deleteRecord('medical', id),

  // Ficha nutricional
  addNutrition: (n) => addRecord('nutrition', n),
  updateNutrition: (n) => putRecord('nutrition', n),
  getNutritionByPlayer: (playerId) => getByIndex('nutrition', 'playerId', playerId),
  getAllNutrition: () => getAllRecords('nutrition'),
  deleteNutrition: (id) => deleteRecord('nutrition', id),

  // Configuración (baremos, posiciones, categorías de edad, datos del club)
  getConfig: (key) => getRecord('config', key),
  setConfig: (key, value) => putRecord('config', { key, value }),

  // Backup / restauración completa
  exportAll: async () => {
    const [players, evaluations, medical, nutrition, config] = await Promise.all([
      getAllRecords('players'),
      getAllRecords('evaluations'),
      getAllRecords('medical'),
      getAllRecords('nutrition'),
      getAllRecords('config'),
    ]);
    return {
      _app: 'futbol-analytics',
      _version: DB_VERSION,
      _exportedAt: new Date().toISOString(),
      players,
      evaluations,
      medical,
      nutrition,
      config,
    };
  },

  importAll: async (data, { replace = false } = {}) => {
    if (replace) {
      await Promise.all(
        ['players', 'evaluations', 'medical', 'nutrition', 'config'].map(clearStore)
      );
    }
    for (const p of data.players || []) await putRecord('players', p);
    for (const e of data.evaluations || []) await putRecord('evaluations', e);
    for (const m of data.medical || []) await putRecord('medical', m);
    for (const n of data.nutrition || []) await putRecord('nutrition', n);
    for (const c of data.config || []) await putRecord('config', c);
  },

  wipeAll: async () => {
    await Promise.all(
      ['players', 'evaluations', 'medical', 'nutrition', 'config'].map(clearStore)
    );
  },
};

  return { DB };
})();


/* ===== modulo: js/scoring.js ===== */
const Scoring = (function () {
  const { CATEGORIAS } = Seed;

/* ============================================================
   scoring.js — Motor de análisis: baremos, categorías,
   ajuste por posición y observaciones automáticas.
   ============================================================ */


function clamp(n, min, max) {
  return Math.max(min, Math.min(max, n));
}

function nearestAge(ages, age) {
  if (ages.includes(age)) return age;
  if (age < ages[0]) return ages[0];
  if (age > ages[ages.length - 1]) return ages[ages.length - 1];
  // por si falta algún año intermedio, tomar el más cercano
  return ages.reduce((a, b) => (Math.abs(b - age) < Math.abs(a - age) ? b : a));
}

/**
 * Convierte un valor crudo (ej. 42 abdominales) en un puntaje 0-10
 * interpolando dentro del baremo correspondiente a la edad del jugador.
 */
function scoreFromBaremo(baremoTable, age, rawValue) {
  if (rawValue === null || rawValue === undefined || rawValue === '') return null;
  const val = Number(rawValue);
  if (Number.isNaN(val)) return null;

  const a = nearestAge(baremoTable.ages, Math.round(age));
  const values = baremoTable.values[a];
  const points = baremoTable.points;

  // pares (valor, punto) ordenados ascendente por valor
  const pairs = values.map((v, i) => [v, points[i]]).sort((x, y) => x[0] - y[0]);

  if (val <= pairs[0][0]) return 0;
  if (val >= pairs[pairs.length - 1][0]) return 10;

  for (let i = 0; i < pairs.length - 1; i++) {
    const [v0, p0] = pairs[i];
    const [v1, p1] = pairs[i + 1];
    if (val >= v0 && val <= v1) {
      if (v1 === v0) return p0;
      const t = (val - v0) / (v1 - v0);
      return Math.round((p0 + t * (p1 - p0)) * 10) / 10;
    }
  }
  return null;
}

/**
 * Calcula el puntaje 0-10 de cada prueba de una evaluación.
 * evaluation.tests[key] = { valor, score } (score sólo aplica a pruebas
 * cualitativas, se respeta si ya viene asignado por el evaluador).
 */
function computeTestScores(evaluationTests, testDefs, baremos, age) {
  const result = {};
  for (const def of testDefs) {
    const entry = evaluationTests?.[def.key];
    if (!entry) {
      result[def.key] = { valor: null, score: null };
      continue;
    }
    if (def.type === 'quant') {
      const baremo = baremos[def.baremoKey];
      const score = baremo ? scoreFromBaremo(baremo.table, age, entry.valor) : null;
      result[def.key] = { valor: entry.valor ?? null, score };
    } else {
      const score = entry.score === '' || entry.score === undefined ? null : Number(entry.score);
      result[def.key] = { valor: entry.valor ?? null, score: score === null || Number.isNaN(score) ? null : clamp(score, 0, 10) };
    }
  }
  return result;
}

/** Promedia los puntajes de las pruebas dentro de cada categoría física/técnica. */
function computeCategoryScores(testScores, testDefs) {
  const buckets = {};
  for (const def of testDefs) {
    const s = testScores[def.key]?.score;
    if (s === null || s === undefined) continue;
    (buckets[def.categoria] ||= []).push(s);
  }
  const categoryScores = {};
  for (const cat of Object.keys(CATEGORIAS)) {
    const arr = buckets[cat];
    categoryScores[cat] = arr && arr.length ? Math.round((arr.reduce((a, b) => a + b, 0) / arr.length) * 10) / 10 : null;
  }
  return categoryScores;
}

function computeGlobalScore(categoryScores) {
  const vals = Object.values(categoryScores).filter((v) => v !== null && v !== undefined);
  if (!vals.length) return null;
  return Math.round((vals.reduce((a, b) => a + b, 0) / vals.length) * 10) / 10;
}

/**
 * Calcula el índice de idoneidad (0-10) del jugador para cada posición,
 * a partir de los puntajes por categoría y los pesos configurados.
 * Devuelve un ranking ordenado de mayor a menor afinidad.
 */
function computePositionFit(categoryScores, posiciones) {
  const ranking = [];
  for (const [key, pos] of Object.entries(posiciones)) {
    let sum = 0;
    let weightUsed = 0;
    for (const [cat, weight] of Object.entries(pos.weights)) {
      const score = categoryScores[cat];
      if (score === null || score === undefined) continue;
      sum += score * weight;
      weightUsed += weight;
    }
    const fit = weightUsed > 0 ? Math.round((sum / weightUsed) * 10) / 10 : null;
    ranking.push({ key, label: pos.label, fit });
  }
  return ranking.sort((a, b) => (b.fit ?? -1) - (a.fit ?? -1));
}

function nivelTexto(score) {
  if (score === null || score === undefined) return 'sin datos';
  if (score >= 9) return 'excelente';
  if (score >= 7.5) return 'muy bueno';
  if (score >= 6) return 'bueno';
  if (score >= 4.5) return 'a mejorar';
  return 'bajo';
}

/**
 * Genera observaciones automáticas en lenguaje natural: fortalezas,
 * aspectos a trabajar por disciplina y sugerencia de posición.
 */
function generateObservations({ categoryScores, testScores, testDefs, positionFit, imc, imcClasificacion, nombre }) {
  const lines = [];
  const catEntries = Object.entries(categoryScores).filter(([, v]) => v !== null);

  if (catEntries.length) {
    const sorted = [...catEntries].sort((a, b) => b[1] - a[1]);
    const fuertes = sorted.filter((e) => e[1] >= 7);
    const debiles = sorted.filter((e) => e[1] < 6);

    if (fuertes.length) {
      lines.push(
        `Fortalezas: ${fuertes.map(([c, v]) => `${CATEGORIAS[c]} (${v}/10, ${nivelTexto(v)})`).join(', ')}.`
      );
    }
    if (debiles.length) {
      lines.push(
        `Aspectos a trabajar: ${debiles.map(([c, v]) => `${CATEGORIAS[c]} (${v}/10, ${nivelTexto(v)})`).join(', ')}.`
      );
    } else if (fuertes.length) {
      lines.push('No se detectan categorías por debajo de 6/10: perfil físico-técnico equilibrado.');
    }
  } else {
    lines.push('Aún no hay suficientes pruebas registradas para generar un diagnóstico por categoría.');
  }

  // pruebas individuales más bajas (para plan de entrenamiento)
  const testEntries = testDefs
    .map((d) => ({ label: d.label, score: testScores[d.key]?.score }))
    .filter((t) => t.score !== null && t.score !== undefined)
    .sort((a, b) => a.score - b.score);
  if (testEntries.length) {
    const peores = testEntries.slice(0, 3).filter((t) => t.score < 7);
    if (peores.length) {
      lines.push(
        `Pruebas prioritarias para el plan de mejora: ${peores.map((t) => `${t.label} (${t.score}/10)`).join(', ')}.`
      );
    }
  }

  if (imc !== null && imc !== undefined) {
    lines.push(`Composición corporal: IMC ${imc} (${imcClasificacion}).`);
  }

  if (positionFit && positionFit.length && positionFit[0].fit !== null) {
    const top = positionFit.filter((p) => p.fit !== null).slice(0, 2);
    lines.push(
      `Según el perfil físico-técnico actual, las posiciones con mayor afinidad son: ${top
        .map((p) => `${p.label} (${p.fit}/10)`)
        .join(' y ')}.`
    );
  }

  return lines.join(' ');
}

  return { scoreFromBaremo, computeTestScores, computeCategoryScores, computeGlobalScore, computePositionFit, generateObservations };
})();

    });

    el('div', { class: 'card-header' }, [

      el('thead', {}, el('tr', {}, ['Jugador', 'Fecha', 'Score global', 'Posición sugerida', ''].map((h) => el('th', {}, h)))),

    const tbody = el('tbody');

function statCard(value, label) {
  return el('div', { class: 'card stat-card' }, [
    el('div', { class: 'stat-value' }, String(value)),
    el('div', { class: 'stat-label' }, label),
  ]);

function autoCategoria(player, edades) {
  const age = calcAge(player.fechaNacimiento);
  if (age == null) return 'sin-definir';
  const match = edades.find((c) => age >= c.min && age <= c.max);
  return match ? match.key : 'sin-definir';
}

/* ---------------- Importación desde Excel ---------------- */

function normalizeHeader(h) {
  return String(h || '')
    .toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

const HEADER_MATCHERS = [
  { key: 'nombres', test: (h) => h === 'nombres' },
  { key: 'apellidos', test: (h) => h === 'apellidos' },
  { key: 'fechaNacimiento', test: (h) => h.includes('nacim') },
  { key: 'lateralidad', test: (h) => h === 'd i' || h.includes('d i') },
  { key: 'gradoEscolar', test: (h) => h.includes('grado') },
  { key: 'talla', test: (h) => h.includes('talla') },
  { key: 'peso', test: (h) => h.includes('peso') },
  { key: 'fuerzaAbd', test: (h) => h.includes('abd') },
  { key: 'flexoExtension', test: (h) => h.includes('fle') || h.includes('codo') },
  { key: 'saltoVertical', test: (h) => h.includes('vertical') },
  { key: 'saltoHorizontal', test: (h) => h.includes('horizontal') },
  { key: 'coordinacion', test: (h) => h.includes('coordina') },
  { key: 'cooper', test: (h) => h.includes('cooper') },
  { key: 'test30m', test: (h) => h.includes('30') },
  { key: 'conduccion', test: (h) => h.includes('conducc') },
  { key: 'potenciaTiro', test: (h) => h.includes('potencia') },
  { key: 'carreraConPase', test: (h) => h.includes('pase') },
  { key: 'precision', test: (h) => h.includes('precision') },
  { key: 'controlBalon', test: (h) => h.includes('control') },
];

function matchColumn(header) {
  const h = normalizeHeader(header);
  for (const m of HEADER_MATCHERS) if (m.test(h)) return m.key;
  return null;
}

async function handleExcelImport(file) {
  if (!file) return;
  if (typeof XLSX === 'undefined') {
    toast('No se pudo cargar la librería de Excel (sin conexión a internet).', 'error');
    return;
  }
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

    // encontrar la fila de encabezados (contiene "Nombres")
    let headerRowIdx = rows.findIndex((r) => r.some((c) => normalizeHeader(c) === 'nombres'));
    if (headerRowIdx === -1) {
      toast('No se encontró una columna "Nombres" en el archivo.', 'error');
      return;
    }
    const headerRow = rows[headerRowIdx];
    const colMap = {}; // colIndex -> key
    headerRow.forEach((h, i) => {
      const key = matchColumn(h);
      if (key) colMap[i] = key;
    });

    const [players, cfg] = await Promise.all([DB.getAllPlayers(), loadCfg()]);
    const { baremos, testDefs, posiciones } = cfg;
    const findPlayer = (nombres, apellidos) =>
      players.find(
        (p) => normalizeHeader(p.nombres) === normalizeHeader(nombres) && normalizeHeader(p.apellidos) === normalizeHeader(apellidos)
      );

    let created = 0;
    let evaluated = 0;
    const fecha = todayISO();

    for (let r = headerRowIdx + 1; r < rows.length; r++) {
      const row = rows[r];
      const rec = {};
      Object.entries(colMap).forEach(([i, key]) => (rec[key] = row[Number(i)]));
      if (!rec.nombres && !rec.apellidos) continue;

      let player = findPlayer(rec.nombres, rec.apellidos);
      if (!player) {
        player = await DB.addPlayer({
          nombres: String(rec.nombres || '').trim(),
          apellidos: String(rec.apellidos || '').trim(),
          fechaNacimiento: excelDateToISO(rec.fechaNacimiento) || '',
          lateralidad: rec.lateralidad || '',
          gradoEscolar: rec.gradoEscolar || '',
          sexo: 'M', estado: 'activo',
          club: '', equipo: '', posicionPrincipal: '', categoriaEdad: '',
        });
        players.push(player);
        created++;
      }

      const age = player.fechaNacimiento ? calcAge(player.fechaNacimiento, fecha) : 13;
      const talla = num(rec.talla);
      const peso = num(rec.peso);
      const imc = calcIMC(peso, talla);

      const tests = {};
      testDefs.forEach((d) => {
        const raw = rec[d.key];
        if (raw === undefined || raw === '') { tests[d.key] = { valor: null, score: undefined }; return; }
        tests[d.key] = d.type === 'quant' ? { valor: num(raw) } : { valor: num(raw), score: undefined };
      });

      const testScores = computeTestScores(tests, testDefs, baremos, age ?? 13);
      const categoryScores = computeCategoryScores(testScores, testDefs);
      const scoreFisicoGlobal = computeGlobalScore(categoryScores);
      const positionFit = computePositionFit(categoryScores, posiciones);
      const observaciones = generateObservations({
        categoryScores, testScores, testDefs, positionFit, imc, imcClasificacion: clasificarIMC(imc), nombre: player.nombres,
      });

      await DB.addEvaluation({
        playerId: player.id, fecha, edadAlMomento: age, talla, peso, imc, imcClasificacion: clasificarIMC(imc),
        tests, testScores, categoryScores, scoreFisicoGlobal, positionFit, observaciones,
        notasEvaluador: 'Importado desde matriz Excel del club.', evaluador: '',
      });
      evaluated++;
    }

    toast(`Importación completa: ${evaluated} evaluaciones, ${created} jugadores nuevos.`, 'success');
    navigate('/evaluaciones');
    setTimeout(() => window.location.reload(), 400);
  } catch (err) {
    console.error(err);
    toast('Error al importar el archivo: ' + err.message, 'error');
  }
}

function num(v) {
  if (v === '' || v === undefined || v === null) return null;
  const n = Number(String(v).replace(',', '.'));
  return Number.isNaN(n) ? null : n;
}

function excelDateToISO(v) {
  if (!v) return '';
  if (v instanceof Date) return v.toISOString().slice(0, 10);
  if (typeof v === 'number') {
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    return d.toISOString().slice(0, 10);
  }
  const s = String(v).trim();
  const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if (m) {
    let [, d, mo, y] = m;
    if (y.length === 2) y = '20' + y;
    return `${y}-${mo.padStart(2, '0')}-${d.padStart(2, '0')}`;
  }
  return '';
}

  return { renderEvaluationsList, renderEvaluationForm, renderEvaluationDetail };
})();

      el('div', { class: 'field' }, [el('label', {}, 'Talla'), tallaInput]),
      el('div', { class: 'field' }, [el('label', {}, '% grasa corporal (si se midió)'), el('input', { id: 'porcentajeGrasa', type: 'number', step: '0.1', min: '0', value: n0.porcentajeGrasa ?? '' })]),
      el('div', { class: 'field' }, [el('label', {}, 'IMC (automático)'), imcOut]),
    ])
  );

  form.appendChild(
    el('div', { class: 'field' }, [el('label', {}, 'Plan alimenticio'), el('textarea', { id: 'planAlimenticio', rows: 3 }, n0.planAlimenticio || '')])
  );
  form.appendChild(
    el('div', { class: 'form-row' }, [
      el('div', { class: 'field' }, [el('label', {}, 'Suplementación'), el('input', { id: 'suplementacion', value: n0.suplementacion || '' })]),
      el('div', { class: 'field' }, [el('label', {}, 'Hidratación / recomendaciones'), el('input', { id: 'hidratacion', value: n0.hidratacion || '' })]),
    ])
  );
  form.appendChild(
    el('div', { class: 'field' }, [el('label', {}, 'Observaciones del nutricionista'), el('textarea', { id: 'observacionesNutricionista', rows: 3 }, n0.observacionesNutricionista || '')])
  );

    el('button', { type: 'button', class: 'btn btn-outline', onClick: () => history.back() }, 'Cancelar'),
  ]);
  if (isEdit) {
    actions.appendChild(
      el('button', {
        type: 'button', class: 'btn btn-danger', style: 'margin-left:auto;',
        onClick: async () => {
          if (confirmDialog('¿Eliminar este registro nutricional?')) {

            navigate('/nutricion');
          }

/* ===== modulo: js/views/reports.js ===== */
const ViewReports = (function () {
  const { DB } = DBMod;
  const { el, calcAge, navigate } = Utils;
  const { CATEGORIAS } = Seed;

/* ============================================================
   views/reports.js — Reportes comparativos del equipo
   ============================================================ */




let barChartInstance = null;

async function renderReports(container) {
  const [players, evaluations, edadesCfg, posicionesCfg] = await Promise.all([
    DB.getAllPlayers(),
    DB.getAllEvaluations(),
    DB.getConfig('categoriasEdad'),
    DB.getConfig('posiciones'),
  ]);
  const edades = edadesCfg?.value || [];
  const posiciones = posicionesCfg?.value || {};

  // última evaluación por jugador
  const lastByPlayer = {};
  evaluations.forEach((ev) => {
    const cur = lastByPlayer[ev.playerId];
    if (!cur || (ev.fecha || '') > (cur.fecha || '')) lastByPlayer[ev.playerId] = ev;
  });

  const exportBtn = el('button', { class: 'btn btn-outline' }, '⬇️ Exportar CSV');
  const card = el('div', { class: 'card' });
  card.appendChild(
    el('div', { class: 'card-header' }, [
      el('h2', {}, 'Reportes del equipo'),
      exportBtn,
    ])
  );

  const catSelect = el('select', {}, [el('option', { value: '' }, 'Todas las categorías'), ...edades.map((c) => el('option', { value: c.key }, c.label))]);
  const posSelect = el('select', {}, [el('option', { value: '' }, 'Todas las posiciones'), ...Object.entries(posiciones).map(([k, p]) => el('option', { value: k }, p.label))]);
  const filterRow = el('div', { class: 'form-row', style: 'margin-bottom:16px;' }, [catSelect, posSelect]);
  card.appendChild(filterRow);

  const canvas = el('canvas', { height: '260' });
  const chartCard = el('div', { class: 'chart-wrap', style: 'max-width:640px;' }, canvas);
  card.appendChild(chartCard);

  const wrap = el('div', { class: 'table-wrap mt-16' });
  card.appendChild(wrap);
  container.appendChild(card);

  function getFiltered() {
    const fc = catSelect.value;
    const fp = posSelect.value;
    return players.filter((p) => {
      if (fc && p.categoriaEdad !== fc) return false;
      if (fp && p.posicionPrincipal !== fp) return false;
      return true;
    });
  }

  function draw() {
    const filtered = getFiltered();
    const rows = filtered
      .map((p) => ({ player: p, ev: lastByPlayer[p.id] }))
      .sort((a, b) => (b.ev?.scoreFisicoGlobal ?? -1) - (a.ev?.scoreFisicoGlobal ?? -1));

    wrap.innerHTML = '';
    if (!rows.length) {
      wrap.appendChild(el('div', { class: 'empty-state' }, el('p', {}, 'No hay jugadores que coincidan con el filtro.')));
    } else {
      const table = el('table', {}, [
        el('thead', {}, el('tr', {}, ['#', 'Jugador', 'Posición', 'Última evaluación', 'Score global', 'Posición sugerida', ''].map((h) => el('th', {}, h)))),
      ]);
      const tbody = el('tbody');
      rows.forEach((r, i) => {
        const posLabel = posiciones[r.player.posicionPrincipal]?.label || '—';
        tbody.appendChild(
          el('tr', { style: 'cursor:pointer;', onClick: () => navigate(`/jugadores/${r.player.id}`) }, [
            el('td', {}, String(i + 1)),
            el('td', {}, `${r.player.nombres} ${r.player.apellidos}`),
            el('td', {}, posLabel),
            el('td', {}, r.ev ? r.ev.fecha : 'Sin evaluar'),
            el('td', {}, r.ev?.scoreFisicoGlobal != null ? el('span', { class: 'badge badge-green' }, `${r.ev.scoreFisicoGlobal}/10`) : el('span', { class: 'badge badge-gray' }, 'N/D')),
            el('td', {}, r.ev?.positionFit?.[0]?.label || '—'),
            el('td', { class: 'text-right' }, el('span', { class: 'btn-link' }, 'Ver →')),
          ])
        );
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
    }

    // promedio por categoría (equipo filtrado)
    const catKeys = Object.keys(CATEGORIAS);
    const averages = catKeys.map((c) => {
      const vals = rows.map((r) => r.ev?.categoryScores?.[c]).filter((v) => v !== null && v !== undefined);
      return vals.length ? Math.round((vals.reduce((a, b) => a + b, 0) / vals.length) * 10) / 10 : 0;
    });

    if (canvas && typeof Chart !== 'undefined') {
      if (barChartInstance) barChartInstance.destroy();
      barChartInstance = new Chart(canvas.getContext('2d'), {
        type: 'bar',
        data: {
          labels: catKeys.map((c) => CATEGORIAS[c]),
          datasets: [{ label: 'Promedio del equipo (0-10)', data: averages, backgroundColor: '#22c55e' }],
        },
        options: { scales: { y: { min: 0, max: 10 } }, plugins: { legend: { display: false } } },
      });
    }
  }

  catSelect.addEventListener('change', draw);
  posSelect.addEventListener('change', draw);
  exportBtn.addEventListener('click', () => exportCSV(getFiltered(), lastByPlayer, posiciones));

  draw();
}

function exportCSV(players, lastByPlayer, posiciones) {
  const header = ['Nombres', 'Apellidos', 'D.I.', 'Edad', 'Posición', 'Última evaluación', 'IMC', 'Score físico global', 'Posición sugerida'];
  const rows = players.map((p) => {
    const ev = lastByPlayer[p.id];
    return [
      p.nombres, p.apellidos, p.documentoIdentidad || '', calcAge(p.fechaNacimiento) ?? '', posiciones[p.posicionPrincipal]?.label || '',
      ev?.fecha || '', ev?.imc ?? '', ev?.scoreFisicoGlobal ?? '', ev?.positionFit?.[0]?.label || '',
    ];
  });
  const csv = [header, ...rows].map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'reporte_equipo.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

  return { renderReports };
})();


/* ===== modulo: js/views/settings.js ===== */
const ViewSettings = (function () {
  const { DB } = DBMod;
  const { el, toast, confirmDialog } = Utils;
  const { CATEGORIAS, BAREMOS_SEED, POSICIONES_SEED, CATEGORIAS_EDAD_SEED, CLUB_INFO_SEED } = Seed;

/* ============================================================
   views/settings.js — Configuración: club, categorías de edad,
   posiciones (pesos) y baremos (tablas de puntuación editables).
   ============================================================ */




async function renderSettings(container) {
  const card = el('div', { class: 'card' });
  card.appendChild(el('h2', {}, 'Configuración'));
  card.appendChild(
    el('p', { class: 'help-text' }, 'Todos los valores por defecto provienen del estudio y los protocolos de valoración del club. Ajusta lo que necesites; los cambios aplican a las próximas evaluaciones (las ya guardadas no se recalculan automáticamente).')
  );

  const tabs = el('div', { class: 'tabs' });
  const btns = {
    general: el('button', { class: 'tab-btn active' }, '🏟️ Club'),
    edades: el('button', { class: 'tab-btn' }, '🎂 Categorías de edad'),
    posiciones: el('button', { class: 'tab-btn' }, '📍 Posiciones'),
    baremos: el('button', { class: 'tab-btn' }, '📐 Baremos'),
  };
  Object.values(btns).forEach((b) => tabs.appendChild(b));
  card.appendChild(tabs);

  const panels = {
    general: el('div', {}),
    edades: el('div', { style: 'display:none;' }),
    posiciones: el('div', { style: 'display:none;' }),
    baremos: el('div', { style: 'display:none;' }),
  };

  function showTab(name) {
    for (const k of Object.keys(panels)) {
      panels[k].style.display = k === name ? '' : 'none';
      btns[k].classList.toggle('active', k === name);
    }
  }
  Object.entries(btns).forEach(([k, b]) => b.addEventListener('click', () => showTab(k)));

  await buildGeneral(panels.general);
  await buildEdades(panels.edades);
  await buildPosiciones(panels.posiciones);

/* ---------------- Club ---------------- */
async function buildGeneral(panel) {
  const cfg = (await DB.getConfig('clubInfo'))?.value || CLUB_INFO_SEED;
  const nombreInput = el('input', { id: 'nombreClub', value: cfg.nombreClub || '' });
  panel.appendChild(

  );

    el('button', {

  );

/* ---------------- Categorías de edad ---------------- */
async function buildEdades(panel) {
  let edades = (await DB.getConfig('categoriasEdad'))?.value || CATEGORIAS_EDAD_SEED;
  edades = edades.map((e) => ({ ...e }));

  const wrap = el('div', { class: 'table-wrap' });
  const table = el('table', {}, [el('thead', {}, el('tr', {}, ['Etiqueta', 'Edad mínima', 'Edad máxima', ''].map((h) => el('th', {}, h))))]);
  const tbody = el('tbody');
  table.appendChild(tbody);
  wrap.appendChild(table);

  function draw() {
    tbody.innerHTML = '';
    edades.forEach((c, i) => {
      const labelInput = el('input', { value: c.label });
      const minInput = el('input', { type: 'number', value: c.min, style: 'width:80px;' });
      const maxInput = el('input', { type: 'number', value: c.max, style: 'width:80px;' });
      labelInput.addEventListener('input', () => (c.label = labelInput.value));
      minInput.addEventListener('input', () => (c.min = Number(minInput.value)));
      maxInput.addEventListener('input', () => (c.max = Number(maxInput.value)));
      tbody.appendChild(
        el('tr', {}, [
          el('td', {}, labelInput),
          el('td', {}, minInput),
          el('td', {}, maxInput),
          el('td', {}, el('button', {
            class: 'btn btn-danger btn-sm', type: 'button',
            onClick: () => { edades.splice(i, 1); draw(); },
          }, 'Quitar')),
        ])
      );
    });
  }
  draw();
  panel.appendChild(wrap);

  panel.appendChild(
    el('div', { class: 'flex gap-8 mt-16' }, [
      el('button', {
        class: 'btn btn-outline', type: 'button',
        onClick: () => { edades.push({ key: 'cat_' + Date.now(), label: 'Nueva categoría', min: 6, max: 8 }); draw(); },
      }, '+ Agregar categoría'),
      el('button', {
        class: 'btn btn-primary', type: 'button',
        onClick: async () => { await DB.setConfig('categoriasEdad', edades); toast('Categorías de edad guardadas', 'success'); },
      }, 'Guardar cambios'),
    ])
  );
}

/* ---------------- Posiciones ---------------- */
async function buildPosiciones(panel) {
  let posiciones = (await DB.getConfig('posiciones'))?.value || POSICIONES_SEED;
  posiciones = JSON.parse(JSON.stringify(posiciones));
  const catKeys = Object.keys(CATEGORIAS);

  const listWrap = el('div');
  panel.appendChild(el('p', { class: 'help-text' }, 'El peso de cada categoría indica qué tanto influye en el índice de idoneidad para esa posición. No es obligatorio que sumen exactamente 1.0.'));
  panel.appendChild(listWrap);

  function draw() {
    listWrap.innerHTML = '';
    Object.entries(posiciones).forEach(([key, pos]) => {
      const labelInput = el('input', { value: pos.label, style: 'font-weight:700; max-width:260px;' });
      labelInput.addEventListener('input', () => (pos.label = labelInput.value));

      const sumEl = el('span', { class: 'badge badge-gray' }, '');
      function updateSum() {
        const sum = catKeys.reduce((s, c) => s + (Number(pos.weights[c]) || 0), 0);
        sumEl.textContent = `Suma: ${Math.round(sum * 100) / 100}`;
      }

      const weightInputs = catKeys.map((c) => {
        const inp = el('input', { type: 'number', step: '0.05', min: '0', max: '1', value: pos.weights[c] ?? 0 });
        inp.addEventListener('input', () => { pos.weights[c] = Number(inp.value); updateSum(); });
        return el('div', { class: 'field' }, [el('label', {}, CATEGORIAS[c]), inp]);
      });

      updateSum();

      listWrap.appendChild(
        el('div', { class: 'card', style: 'box-shadow:none;' }, [
          el('div', { class: 'flex-between' }, [
            labelInput,
            el('div', { class: 'flex gap-8' }, [
              sumEl,
              el('button', {
                class: 'btn btn-danger btn-sm', type: 'button',
                onClick: () => { delete posiciones[key]; draw(); },
              }, 'Quitar posición'),
            ]),
          ]),
          el('div', { class: 'form-row mt-8' }, weightInputs),
        ])
      );
    });
  }
  draw();

  panel.appendChild(
    el('div', { class: 'flex gap-8 mt-16' }, [
      el('button', {
        class: 'btn btn-outline', type: 'button',
        onClick: () => {
          const key = 'pos_' + Date.now();
          posiciones[key] = { label: 'Nueva posición', weights: Object.fromEntries(catKeys.map((c) => [c, 0])) };
          draw();
        },
      }, '+ Agregar posición'),
      el('button', {
        class: 'btn btn-primary', type: 'button',
        onClick: async () => { await DB.setConfig('posiciones', posiciones); toast('Posiciones guardadas', 'success'); },
      }, 'Guardar cambios'),
    ])
  );
}

/* ---------------- Baremos ---------------- */
async function buildBaremos(panel) {
  let baremos = (await DB.getConfig('baremos'))?.value || BAREMOS_SEED;
  baremos = JSON.parse(JSON.stringify(baremos));

  const select = el('select', {}, Object.entries(baremos).map(([k, b]) => el('option', { value: k }, b.label)));
  panel.appendChild(el('div', { class: 'field', style: 'max-width:400px;' }, [el('label', {}, 'Prueba física'), select]));

  const gridHost = el('div', { class: 'table-wrap mt-16' });
  panel.appendChild(gridHost);

  function drawGrid() {
    const key = select.value;
    const baremo = baremos[key];
    gridHost.innerHTML = '';
    if (baremo.estimated) {
      gridHost.appendChild(el('p', { class: 'badge badge-amber' }, 'Tabla estimada — se recomienda calibrar con datos reales del club.'));
    }
    const table = el('table');
    const thead = el('thead', {}, el('tr', {}, [el('th', {}, 'Puntos'), ...baremo.table.ages.map((a) => el('th', {}, `${a} años`))]));
    table.appendChild(thead);
    const tbody = el('tbody');
    baremo.table.points.forEach((pt, rowIdx) => {
      const cells = baremo.table.ages.map((age) => {
        const input = el('input', { type: 'number', step: 'any', value: baremo.table.values[age][rowIdx], style: 'width:80px;' });
        input.addEventListener('input', () => { baremo.table.values[age][rowIdx] = Number(input.value); });
        return el('td', {}, input);
      });
      tbody.appendChild(el('tr', {}, [el('td', {}, el('strong', {}, String(pt))), ...cells]));
    });
    table.appendChild(tbody);
    gridHost.appendChild(table);
  }
  select.addEventListener('change', drawGrid);
  drawGrid();

  panel.appendChild(
    el('div', { class: 'flex gap-8 mt-16' }, [
      el('button', {
        class: 'btn btn-primary', type: 'button',
        onClick: async () => { await DB.setConfig('baremos', baremos); toast('Baremos guardados', 'success'); },
      }, 'Guardar cambios de esta tabla'),
      el('button', {
        class: 'btn btn-outline', type: 'button',
        onClick: () => {
          if (confirmDialog('¿Restaurar todos los baremos a los valores originales del estudio del club?')) {
            baremos = JSON.parse(JSON.stringify(BAREMOS_SEED));
            drawGrid();
          }
        },
      }, 'Restaurar valores originales'),
    ])
  );
}

  return { renderSettings };
})();

async function renderBackup(container) {

  card.appendChild(el('h2', {}, 'Copia de seguridad'));
  card.appendChild(
    el('div', { class: 'obs-box', style: 'background:#fef3c7; border-color:#fde68a; color:#78350f;' }, [
      el('strong', {}, '⚠️ Importante: '),
      'toda la información de esta aplicación (jugadores, fotos, evaluaciones, fichas médicas y nutricionales) se guarda ',
      el('strong', {}, 'únicamente en este navegador, en este computador'),
      '. Si limpias los datos del navegador, cambias de equipo o de navegador, perderás la información salvo que tengas un respaldo. Se recomienda exportar un respaldo periódicamente (por ejemplo, después de cada jornada de evaluaciones).',
    ])
  );

  const stats = await getStats();
  card.appendChild(
    el('div', { class: 'grid grid-4 mt-16' }, [
      stat(stats.players, 'Jugadores'),
      stat(stats.evaluations, 'Evaluaciones'),
      stat(stats.medical, 'Registros médicos'),
      stat(stats.nutrition, 'Registros nutricionales'),
    ])
  );

  card.appendChild(el('hr', { class: 'divider' }));

  card.appendChild(el('h3', {}, 'Exportar respaldo'));
  card.appendChild(el('p', { class: 'help-text' }, 'Descarga un archivo .json con toda la información. Guárdalo en un lugar seguro (nube, USB, etc).'));
  card.appendChild(
    el('button', {
      class: 'btn btn-primary', onClick: async () => {
        const data = await DB.exportAll();
        const stamp = new Date().toISOString().slice(0, 10);
        downloadJSON(data, `futbol-analytics-respaldo-${stamp}.json`);
        toast('Respaldo descargado', 'success');
      },
    }, '⬇️ Descargar respaldo completo (.json)')
  );

  card.appendChild(el('hr', { class: 'divider' }));

  card.appendChild(el('h3', {}, 'Restaurar / importar respaldo'));
  card.appendChild(el('p', { class: 'help-text' }, 'Selecciona un archivo .json exportado previamente desde esta misma aplicación.'));
  const modeSelect = el('select', { id: 'import-mode', style: 'max-width:320px;' }, [
    el('option', { value: 'merge' }, 'Combinar con los datos actuales'),
    el('option', { value: 'replace' }, 'Reemplazar todos los datos actuales'),
  ]);
  card.appendChild(el('div', { class: 'field', style: 'max-width:320px;' }, [el('label', {}, 'Modo de importación'), modeSelect]));

  const fileInput = el('input', { type: 'file', accept: 'application/json' });
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const replace = modeSelect.value === 'replace';
    if (replace && !confirmDialog('Esto borrará todos los datos actuales y los reemplazará por los del archivo. ¿Continuar?')) {
      fileInput.value = '';
      return;
    }
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (data._app !== 'futbol-analytics') {
        if (!confirmDialog('Este archivo no parece un respaldo de Futbol Analytics. ¿Intentar importarlo de todas formas?')) return;
      }
      await DB.importAll(data, { replace });
      toast('Datos importados correctamente', 'success');
      setTimeout(() => window.location.reload(), 600);
    } catch (err) {
      console.error(err);
      toast('No se pudo leer el archivo: ' + err.message, 'error');
    }
  });
  card.appendChild(fileInput);

  card.appendChild(el('hr', { class: 'divider' }));

  card.appendChild(el('h3', {}, 'Zona de peligro'));
  card.appendChild(
    el('button', {
      class: 'btn btn-danger', onClick: async () => {
        if (confirmDialog('Esto elimina TODOS los jugadores, evaluaciones, fichas médicas, nutricionales y configuración. ¿Estás seguro? Esta acción no se puede deshacer.')) {
          await DB.wipeAll();
          toast('Todos los datos fueron eliminados', 'success');
          setTimeout(() => window.location.reload(), 600);
        }
      },
    }, '🗑️ Borrar todos los datos de la aplicación')
  );

  container.appendChild(card);
}

function stat(value, label) {
  return el('div', { class: 'stat-card' }, [el('div', { class: 'stat-value' }, String(value)), el('div', { class: 'stat-label' }, label)]);
}

async function getStats() {
  const [players, evaluations, medical, nutrition] = await Promise.all([
    DB.getAllPlayers(), DB.getAllEvaluations(), DB.getAllMedical(), DB.getAllNutrition(),
  ]);
  return { players: players.length, evaluations: evaluations.length, medical: medical.length, nutrition: nutrition.length };
}

  return { renderBackup };
})();


/* ===== modulo: js/app.js ===== */
(function () {
  const { DB } = DBMod;
  const { seedIfEmpty } = Seed;
  const { toast, navigate } = Utils;
  const { renderDashboard } = ViewDashboard;
  const { renderPlayersList, renderPlayerForm } = ViewPlayers;
  const { renderPlayerProfile } = ViewPlayerProfile;
  const { renderEvaluationsList, renderEvaluationForm, renderEvaluationDetail } = ViewEvaluation;
  const { renderMedicalList, renderMedicalForm } = ViewMedical;
  const { renderNutritionList, renderNutritionForm } = ViewNutrition;
  const { renderReports } = ViewReports;
  const { renderSettings } = ViewSettings;
  const { renderBackup } = ViewImportExport;

/* ============================================================
   app.js — Punto de entrada, router hash-based y navegación
   ============================================================ */













const app = document.getElementById('app');
const pageTitle = document.getElementById('page-title');
const nav = document.getElementById('main-nav');

const TITLES = {
  dashboard: 'Panel general',
  jugadores: 'Jugadores',
  evaluaciones: 'Evaluaciones físicas',
  medico: 'Ficha médica',
  nutricion: 'Ficha nutricional',
  reportes: 'Reportes',
  configuracion: 'Configuración',
  backup: 'Copia de seguridad',
};

function setActiveNav(section) {
  nav.querySelectorAll('a').forEach((a) => {
    a.classList.toggle('active', a.dataset.route === section);
  });
  pageTitle.textContent = TITLES[section] || 'Futbol Analytics';
  document.title = `${TITLES[section] || ''} · Futbol Analytics`;
}

// Token de renderizado: evita que una navegación en curso (que aún espera
// datos de IndexedDB) sobrescriba a una navegación posterior más reciente,
// y evita duplicar contenido si el evento hashchange llega más de una vez.
let renderToken = 0;

async function router() {
  const myToken = ++renderToken;

  const rawHash = window.location.hash.replace(/^#/, '') || '/dashboard';
  const hash = rawHash.split('?')[0]; // separar la ruta de los parámetros de consulta (?player=...)
  const parts = hash.split('/').filter(Boolean);
  const section = parts[0] || 'dashboard';

  // Se construye en un contenedor separado (fuera del DOM visible) y sólo
  // se intercambia con el contenido real si esta sigue siendo la navegación
  // más reciente una vez resueltas las promesas.
  const buffer = document.createElement('div');
  setActiveNav(section);

  try {
    switch (section) {
      case 'dashboard':
        await renderDashboard(buffer);
        break;

      case 'jugadores':
        if (parts[1] === 'nuevo') await renderPlayerForm(buffer, null);
        else if (parts[2] === 'editar') await renderPlayerForm(buffer, parts[1]);
        else if (parts[1]) await renderPlayerProfile(buffer, parts[1]);
        else await renderPlayersList(buffer);
        break;

      case 'evaluaciones':
        if (parts[1] === 'nueva') await renderEvaluationForm(buffer, null, getQueryParam('player'));
        else if (parts[2] === 'editar') await renderEvaluationForm(buffer, parts[1], null);
        else if (parts[1]) await renderEvaluationDetail(buffer, parts[1]);
        else await renderEvaluationsList(buffer);
        break;

      case 'medico':
        if (parts[1] === 'nueva') await renderMedicalForm(buffer, null, getQueryParam('player'));
        else if (parts[2] === 'editar') await renderMedicalForm(buffer, parts[1], null);
        else await renderMedicalList(buffer);
        break;

      case 'nutricion':
        if (parts[1] === 'nueva') await renderNutritionForm(buffer, null, getQueryParam('player'));
        else if (parts[2] === 'editar') await renderNutritionForm(buffer, parts[1], null);
        else await renderNutritionList(buffer);
        break;

      case 'reportes':
        await renderReports(buffer);
        break;

      case 'configuracion':
        await renderSettings(buffer);
        break;

      case 'backup':
        await renderBackup(buffer);
        break;

      default:
        buffer.innerHTML = '<div class="card">Página no encontrada.</div>';
    }
  } catch (err) {
    console.error(err);
    buffer.innerHTML = `<div class="card"><h3>Ocurrió un error al cargar esta sección</h3><p class="muted">${err.message}</p></div>`;
  }

  // Si mientras se esperaban los datos el usuario navegó a otra ruta,
  // se descarta este resultado desactualizado.
  if (myToken !== renderToken) return;
  app.innerHTML = '';
  app.appendChild(buffer);
}

function getQueryParam(name) {
  const hash = window.location.hash;
  const qIndex = hash.indexOf('?');
  if (qIndex === -1) return null;
  const params = new URLSearchParams(hash.slice(qIndex + 1));
  return params.get(name);
}

async function init() {
  await seedIfEmpty(DB);

  const club = await DB.getConfig('clubInfo');
  if (club?.value?.nombreClub) {
    document.getElementById('club-name').textContent = club.value.nombreClub;
  }

  window.addEventListener('hashchange', router);
  router();

  document.getElementById('menu-toggle').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('open');
  });

  document.getElementById('quick-add-player').addEventListener('click', () => {
    navigate('/jugadores/nuevo');
  });

  nav.addEventListener('click', () => {
    document.getElementById('sidebar').classList.remove('open');
  });
}

window.futbolAnalytics = { DB, navigate, toast };

init();
})();

</script>
</body>
